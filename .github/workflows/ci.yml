name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server - lint & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/campus_wellness_test
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # After the first `npm install`, commit server/package-lock.json and add:
          #   cache: npm
          #   cache-dependency-path: server/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  client:
    name: Client - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
        continue-on-error: true # pre-existing lint findings should not block; tighten later
      - run: npm run build
        env:
          VITE_BACKEND_URL: ""

  images:
    name: Build & push images (GHCR)
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            context: ./server
          - name: web
            context: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Free-tier friendly: Render (or any host) redeploys when its deploy hook is called.
      # Add repository secrets RENDER_API_DEPLOY_HOOK / RENDER_WEB_DEPLOY_HOOK to enable.
      - name: Trigger deploy hooks
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          for hook in "$API_HOOK" "$WEB_HOOK"; do
            if [ -n "$hook" ]; then curl -fsS -X POST "$hook" && echo " deploy triggered"; fi
          done
          [ -n "$API_HOOK$WEB_HOOK" ] || echo "No deploy hooks configured - images were published to GHCR only."
